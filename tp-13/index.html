<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>
                
                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-3">
    <button type="button" id="btn-ordenar" class="btn btn-success">
        Ordenar A-Z
    </button>

    <button type="button" id="btn-limpiar" class="btn btn-danger">
        Limpiar Lista
    </button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script>

const lista = document.getElementById("lista-productos");

// Cargar productos guardados
window.onload = cargarProductos;

function guardarProductos() {

    let productos = [];

    lista.querySelectorAll("li").forEach(li => {

        productos.push({
            nombre: li.querySelector("span").textContent,
            comprado: li.classList.contains("list-group-item-success")
        });

    });

    localStorage.setItem("productos", JSON.stringify(productos));

}

function cargarProductos(){

    let productos = JSON.parse(localStorage.getItem("productos"));

    if(productos){

        lista.innerHTML = "";

        productos.forEach(producto => {

            agregarProducto(producto.nombre, producto.comprado);

        });

    }else{

        lista.innerHTML = "";
        agregarProducto("Pan");

    }

}

/**
 * Agregar producto
 */

function agregarProducto(nombreProducto, comprado = false){

    nombreProducto = nombreProducto.trim();

    if(nombreProducto == "")
        return;

    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between align-items-center";

    if(comprado)
        li.classList.add("list-group-item-success");

    const span = document.createElement("span");
    span.textContent = nombreProducto;

    if(comprado)
        span.style.textDecoration = "line-through";

    // Marcar comprado
    span.addEventListener("click", function(){

        li.classList.toggle("list-group-item-success");

        if(li.classList.contains("list-group-item-success"))
            span.style.textDecoration = "line-through";
        else
            span.style.textDecoration = "none";

        guardarProductos();

    });

    // Editar
    const btnEditar = document.createElement("button");
    btnEditar.textContent = "Editar";
    btnEditar.className = "btn btn-warning btn-sm me-1";

    btnEditar.onclick = function(){

        let nuevo = prompt("Nuevo nombre:", span.textContent);

        if(nuevo != null && nuevo.trim() != ""){

            span.textContent = nuevo.trim();
            guardarProductos();

        }

    };

    // Eliminar
    const btnEliminar = document.createElement("button");
    btnEliminar.textContent = "Eliminar";
    btnEliminar.className = "btn btn-danger btn-sm";

    btnEliminar.onclick = function(){

        li.remove();
        guardarProductos();

    };

    const botones = document.createElement("div");

    botones.appendChild(btnEditar);
    botones.appendChild(btnEliminar);

    li.prepend(span);
    li.appendChild(botones);

    lista.appendChild(li);

    guardarProductos();

}

function handlerFormulario(evento){

    evento.preventDefault();

    const input = evento.target.querySelector("input");

    agregarProducto(input.value);

    input.value = "";

}

document.querySelector("form").addEventListener("submit", handlerFormulario);

// Limpiar lista
document.getElementById("btn-limpiar").addEventListener("click", function(){

    lista.innerHTML = "";

    guardarProductos();

});

// Ordenar lista
document.getElementById("btn-ordenar").addEventListener("click", function(){

    let items = Array.from(lista.querySelectorAll("li"));

    items.sort(function(a,b){

        let nombreA = a.querySelector("span").textContent.toLowerCase();
        let nombreB = b.querySelector("span").textContent.toLowerCase();

        return nombreA.localeCompare(nombreB);

    });

    lista.innerHTML = "";

    items.forEach(item => lista.appendChild(item));

    guardarProductos();

});

</script>

</body>
</html>
