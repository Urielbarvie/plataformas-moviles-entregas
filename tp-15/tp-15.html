<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .puntos-display {
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1 class="text-center mb-4">Tablero de Puntos</h1>
        
        <div id="tablero-card" class="card shadow">
            <div class="card-body">
                <!-- Marcador de Puntos -->
                <div class="row text-center align-items-center">
                    <div class="col-5">
                        <span id="puntos-local" class="display-1 fw-bold puntos-display">0</span>
                        <p id="nombre-local-label" class="fs-4 m-0 fw-semibold">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span id="puntos-visitante" class="display-1 fw-bold puntos-display">0</span>
                        <p id="nombre-visitante-label" class="fs-4 m-0 fw-semibold">Visitante</p>
                    </div>
                </div>

                <hr class="hr my-4">

                <!-- Control de Puntos (+ / -) -->
                <h2 class="h4 mb-3">Actualizar Contador</h2>
                <div class="row g-2 mb-3">
                    <!-- Controles Local -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block text-center fw-bold">Puntos Local</label>
                        <div class="d-flex gap-2">
                            <button id="btn-local-mas" class="btn btn-primary w-50 btn-puntuacion">
                                Local (+1)
                            </button>
                            <button id="btn-local-menos" class="btn btn-outline-primary w-50 btn-puntuacion">
                                Local (-1)
                            </button>
                        </div>
                    </div>
                    <!-- Controles Visitante -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block text-center fw-bold">Puntos Visitante</label>
                        <div class="d-flex gap-2">
                            <button id="btn-visitante-mas" class="btn btn-primary w-50 btn-puntuacion">
                                Visitante (+1)
                            </button>
                            <button id="btn-visitante-menos" class="btn btn-outline-primary w-50 btn-puntuacion">
                                Visitante (-1)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Acciones del Partido -->
                <div class="row g-2 mb-4">
                    <div class="col-12 col-sm-4">
                        <button id="btn-invertir" class="btn btn-warning w-100 fw-semibold">
                            Invertir Puntaje
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button id="btn-finalizar" class="btn btn-dark w-100 fw-semibold">
                            Finalizar Partido
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button id="btn-reinicio" class="btn btn-danger w-100 fw-semibold">
                            Reinicio
                        </button>
                    </div>
                </div>

                <hr class="hr my-4">

                <!-- Bonus Track: Personalización -->
                <h2 class="h4 mb-3">Opciones y Personalización</h2>
                <div class="row g-3">
                    <!-- Cambio de nombres -->
                    <div class="col-12 col-md-6">
                        <div class="input-group mb-2">
                            <span class="input-group-text">Local</span>
                            <input type="text" id="input-nombre-local" class="form-control" placeholder="Nombre Local">
                        </div>
                        <div class="input-group">
                            <span class="input-group-text">Visitante</span>
                            <input type="text" id="input-nombre-visitante" class="form-control" placeholder="Nombre Visitante">
                        </div>
                    </div>
                    <!-- Cambio de colores -->
                    <div class="col-12 col-md-6 d-flex flex-column justify-content-between">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <label for="color-fondo" class="form-label m-0 fw-semibold">Color de Fondo:</label>
                            <input type="color" id="color-fondo" class="form-control form-control-color" value="#ffffff">
                        </div>
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="color-texto" class="form-label m-0 fw-semibold">Color del Marcador:</label>
                            <input type="color" id="color-texto" class="form-control form-control-color" value="#0d6efd">
                        </div>
                    </div>
                </div>

                <!-- Ayuda de atajos de teclado -->
                <div class="alert alert-secondary mt-4 mb-0 text-center" role="alert">
                    <small>
                        <strong>Atajos de teclado:</strong> 
                        <code>A</code> (+ Local) | <code>Z</code> (- Local) | 
                        <code>K</code> (+ Visitante) | <code>M</code> (- Visitante) | 
                        <code>R</code> (Reiniciar)
                    </small>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script>
        // --- ESTADO DEL JUEGO ---
        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        // --- REFERENCIAS AL DOM ---
        const elemPuntosLocal = document.getElementById('puntos-local');
        const elemPuntosVisitante = document.getElementById('puntos-visitante');

        const btnLocalMas = document.getElementById('btn-local-mas');
        const btnLocalMenos = document.getElementById('btn-local-menos');
        const btnVisitanteMas = document.getElementById('btn-visitante-mas');
        const btnVisitanteMenos = document.getElementById('btn-visitante-menos');

        const btnInvertir = document.getElementById('btn-invertir');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const btnReinicio = document.getElementById('btn-reinicio');

        const inputNombreLocal = document.getElementById('input-nombre-local');
        const inputNombreVisitante = document.getElementById('input-nombre-visitante');
        const labelNombreLocal = document.getElementById('nombre-local-label');
        const labelNombreVisitante = document.getElementById('nombre-visitante-label');

        const colorFondoInput = document.getElementById('color-fondo');
        const colorTextoInput = document.getElementById('color-texto');
        const tarjetaTablero = document.getElementById('tablero-card');

        const botonesPuntuacion = document.querySelectorAll('.btn-puntuacion');

        // --- FUNCIONES AUXILIARES ---
        function actualizarPantalla() {
            elemPuntosLocal.textContent = puntosLocal;
            elemPuntosVisitante.textContent = puntosVisitante;
        }

        function cambiarEstadoBotonesPuntaje(deshabilitar) {
            partidoFinalizado = deshabilitar;
            botonesPuntuacion.forEach(boton => {
                boton.disabled = deshabilitar;
            });
            btnInvertir.disabled = deshabilitar;
        }

        // --- FUNCIONALIDADES PRINCIPALES ---

        // 1. Sumar y Restar Puntos
        btnLocalMas.addEventListener('click', () => {
            if (partidoFinalizado) return;
            puntosLocal++;
            actualizarPantalla();
        });

        btnLocalMenos.addEventListener('click', () => {
            if (partidoFinalizado) return;
            if (puntosLocal > 0) puntosLocal--;
            actualizarPantalla();
        });

        btnVisitanteMas.addEventListener('click', () => {
            if (partidoFinalizado) return;
            puntosVisitante++;
            actualizarPantalla();
        });

        btnVisitanteMenos.addEventListener('click', () => {
            if (partidoFinalizado) return;
            if (puntosVisitante > 0) puntosVisitante--;
            actualizarPantalla();
        });

        // 2. Invertir Puntaje
        btnInvertir.addEventListener('click', () => {
            if (partidoFinalizado) return;
            const aux = puntosLocal;
            puntosLocal = puntosVisitante;
            puntosVisitante = aux;
            actualizarPantalla();
        });

        // 3. Finalizar Partido
        btnFinalizar.addEventListener('click', () => {
            cambiarEstadoBotonesPuntaje(true);
        });

        // 4. Reinicio
        btnReinicio.addEventListener('click', () => {
            puntosLocal = 0;
            puntosVisitante = 0;
            actualizarPantalla();
            cambiarEstadoBotonesPuntaje(false);
        });

        // --- BONUS TRACKS ---

        // A. Personalización de Nombres
        inputNombreLocal.addEventListener('input', (e) => {
            labelNombreLocal.textContent = e.target.value.trim() !== '' ? e.target.value : 'Local';
        });

        inputNombreVisitante.addEventListener('input', (e) => {
            labelNombreVisitante.textContent = e.target.value.trim() !== '' ? e.target.value : 'Visitante';
        });

        // B. Personalización de Colores
        colorFondoInput.addEventListener('input', (e) => {
            tarjetaTablero.style.backgroundColor = e.target.value;
        });

        colorTextoInput.addEventListener('input', (e) => {
            elemPuntosLocal.style.color = e.target.value;
            elemPuntosVisitante.style.color = e.target.value;
        });

        // C. Atajos de Teclado
        document.addEventListener('keydown', (e) => {
            // Evita activar atajos si el usuario está escribiendo un nombre
            if (e.target.tagName === 'INPUT') return;

            const tecla = e.key.toLowerCase();

            if (tecla === 'q') btnLocalMas.click();
            if (tecla === 'a') btnLocalMenos.click();
            if (tecla === 'w') btnVisitanteMas.click();
            if (tecla === 's') btnVisitanteMenos.click();
            if (tecla === 'r') btnReinicio.click();
        });
    </script>
</body>
</html>
