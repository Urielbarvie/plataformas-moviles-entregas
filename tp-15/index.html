<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
    	<h1>Tablero de Puntos</h1>
        <div id="tablero-card" class="card">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-5">
                        <span id="puntos-local" class="display-1">0</span>
                        <p id="nombre-local-label" class="m-0">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span id="puntos-visitante" class="display-1">0</span>
                        <p id="nombre-visitante-label" class="m-0">Visitante</p>
                    </div>
                </div>

                <hr class="hr">

                <h2>Actualizar Contador</h2>
                <div class="row">
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-local-mas" class="btn d-block w-100 btn-primary">
                            Punto Local (+)
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-local-menos" class="btn d-block w-100 btn-outline-primary">
                            Punto Local (-)
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-visitante-mas" class="btn d-block w-100 btn-primary">
                            Punto Visitante (+)
                        </button>
                    </div>
                    <div class="col-12 col-sm-3 my-1">
                        <button id="btn-visitante-menos" class="btn d-block w-100 btn-outline-primary">
                            Punto Visitante (-)
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-invertir" class="btn d-block w-100 btn-warning">
                            Invertir Puntaje
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-finalizar" class="btn d-block w-100 btn-dark">
                            Finalizar Partido
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button id="btn-reinicio" class="btn d-block w-100 btn-danger">
                            Reinicio
                        </button>
                    </div>
                </div>

                <hr class="hr">

                <h2>Opciones y Personalización</h2>
                <div class="row">
                    <div class="col-12 col-md-6 my-1">
                        <div class="input-group mb-2">
                            <span class="input-group-text">Local</span>
                            <input type="text" id="input-nombre-local" class="form-control" placeholder="Nombre Local">
                        </div>
                        <div class="input-group">
                            <span class="input-group-text">Visitante</span>
                            <input type="text" id="input-nombre-visitante" class="form-control" placeholder="Nombre Visitante">
                        </div>
                    </div>
                    <div class="col-12 col-md-6 my-1">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <label for="color-fondo" class="form-label m-0">Color de Fondo:</label>
                            <input type="color" id="color-fondo" class="form-control form-control-color" value="#ffffff">
                        </div>
                        <div class="d-flex align-items-center justify-content-between">
                            <label for="color-texto" class="form-label m-0">Color del Marcador:</label>
                            <input type="color" id="color-texto" class="form-control form-control-color" value="#0d6efd">
                        </div>
                    </div>
                </div>

                <div class="alert alert-secondary mt-3 mb-0 text-center" role="alert">
                    <small>
                        <strong>Atajos de teclado:</strong>
                        <code>A</code> (+ Local) | <code>Z</code> (- Local) |
                        <code>K</code> (+ Visitante) | <code>M</code> (- Visitante) |
                        <code>R</code> (Reiniciar)
                    </small>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script>
        // --- ESTADO DEL JUEGO ---
        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        // --- REFERENCIAS AL DOM ---
        const elemPuntosLocal = document.getElementById('puntos-local');
        const elemPuntosVisitante = document.getElementById('puntos-visitante');

        const btnLocalMas = document.getElementById('btn-local-mas');
        const btnLocalMenos = document.getElementById('btn-local-menos');
        const btnVisitanteMas = document.getElementById('btn-visitante-mas');
        const btnVisitanteMenos = document.getElementById('btn-visitante-menos');

        const btnInvertir = document.getElementById('btn-invertir');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const btnReinicio = document.getElementById('btn-reinicio');

        const inputNombreLocal = document.getElementById('input-nombre-local');
        const inputNombreVisitante = document.getElementById('input-nombre-visitante');
        const labelNombreLocal = document.getElementById('nombre-local-label');
        const labelNombreVisitante = document.getElementById('nombre-visitante-label');

        const colorFondoInput = document.getElementById('color-fondo');
        const colorTextoInput = document.getElementById('color-texto');
        const tarjetaTablero = document.getElementById('tablero-card');

        // Junto los 4 botones de puntaje en un array para poder habilitarlos/deshabilitarlos juntos
        const botonesPuntuacion = [btnLocalMas, btnLocalMenos, btnVisitanteMas, btnVisitanteMenos];

        // --- FUNCIONES AUXILIARES ---
        function actualizarPantalla() {
            elemPuntosLocal.textContent = puntosLocal;
            elemPuntosVisitante.textContent = puntosVisitante;
        }

        function cambiarEstadoBotonesPuntaje(deshabilitar) {
            partidoFinalizado = deshabilitar;

            // Recorro todos los botones de puntuación y los habilito/deshabilito uno por uno
            for (let i = 0; i < botonesPuntuacion.length; i++) {
                botonesPuntuacion[i].disabled = deshabilitar;
            }

            btnInvertir.disabled = deshabilitar;
        }

        // --- FUNCIONALIDADES PRINCIPALES ---

        // 1. Sumar y Restar Puntos
        function sumarPuntoLocal() {
            if (partidoFinalizado) return;
            puntosLocal = puntosLocal + 1;
            actualizarPantalla();
        }

        function restarPuntoLocal() {
            if (partidoFinalizado) return;
            if (puntosLocal > 0) {
                puntosLocal = puntosLocal - 1;
            }
            actualizarPantalla();
        }

        function sumarPuntoVisitante() {
            if (partidoFinalizado) return;
            puntosVisitante = puntosVisitante + 1;
            actualizarPantalla();
        }

        function restarPuntoVisitante() {
            if (partidoFinalizado) return;
            if (puntosVisitante > 0) {
                puntosVisitante = puntosVisitante - 1;
            }
            actualizarPantalla();
        }

        btnLocalMas.addEventListener('click', sumarPuntoLocal);
        btnLocalMenos.addEventListener('click', restarPuntoLocal);
        btnVisitanteMas.addEventListener('click', sumarPuntoVisitante);
        btnVisitanteMenos.addEventListener('click', restarPuntoVisitante);

        // 2. Invertir Puntaje
        function invertirPuntaje() {
            if (partidoFinalizado) return;
            const aux = puntosLocal;
            puntosLocal = puntosVisitante;
            puntosVisitante = aux;
            actualizarPantalla();
        }
        btnInvertir.addEventListener('click', invertirPuntaje);

        // 3. Finalizar Partido
        function finalizarPartido() {
            cambiarEstadoBotonesPuntaje(true);
        }
        btnFinalizar.addEventListener('click', finalizarPartido);

        // 4. Reinicio
        function reiniciarPartido() {
            puntosLocal = 0;
            puntosVisitante = 0;
            actualizarPantalla();
            cambiarEstadoBotonesPuntaje(false);
        }
        btnReinicio.addEventListener('click', reiniciarPartido);

        // --- BONUS TRACKS ---

        // A. Personalización de Nombres
        function actualizarNombreLocal(e) {
            if (e.target.value.trim() !== '') {
                labelNombreLocal.textContent = e.target.value;
            } else {
                labelNombreLocal.textContent = 'Local';
            }
        }

        function actualizarNombreVisitante(e) {
            if (e.target.value.trim() !== '') {
                labelNombreVisitante.textContent = e.target.value;
            } else {
                labelNombreVisitante.textContent = 'Visitante';
            }
        }

        inputNombreLocal.addEventListener('input', actualizarNombreLocal);
        inputNombreVisitante.addEventListener('input', actualizarNombreVisitante);

        // B. Personalización de Colores
        function cambiarColorFondo(e) {
            tarjetaTablero.style.backgroundColor = e.target.value;
        }

        function cambiarColorMarcador(e) {
            elemPuntosLocal.style.color = e.target.value;
            elemPuntosVisitante.style.color = e.target.value;
        }

        colorFondoInput.addEventListener('input', cambiarColorFondo);
        colorTextoInput.addEventListener('input', cambiarColorMarcador);

        // C. Atajos de Teclado
        // Estos atajos coinciden con el texto de ayuda que se muestra en pantalla:
        // A (+ Local) | Z (- Local) | K (+ Visitante) | M (- Visitante) | R (Reiniciar)
        function manejarAtajoTeclado(e) {
            // Evita activar atajos si el usuario está escribiendo un nombre
            if (e.target.tagName === 'INPUT') return;

            const tecla = e.key.toLowerCase();

            if (tecla === 'a') {
                btnLocalMas.click();
            } else if (tecla === 'z') {
                btnLocalMenos.click();
            } else if (tecla === 'k') {
                btnVisitanteMas.click();
            } else if (tecla === 'm') {
                btnVisitanteMenos.click();
            } else if (tecla === 'r') {
                btnReinicio.click();
            }
        }

        document.addEventListener('keydown', manejarAtajoTeclado);
    </script>
</body>
</html>
