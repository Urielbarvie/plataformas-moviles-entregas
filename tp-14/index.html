<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>
        <div class="card shadow">
            <div class="card-body">

                <!-- Buscador y Filtros -->
                <div class="row g-2 mb-3 align-items-center">
                    <div class="col-12 col-md-5">
                        <input type="text" id="input-buscar" class="form-control" placeholder="Buscar por nombre, apellido o teléfono...">
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="select-orden" class="form-select">
                            <option value="apellido">Ordenar por Apellido</option>
                            <option value="nombre">Ordenar por Nombre</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-4 d-flex gap-2">
                        <button id="btn-filtro-favoritos" class="btn btn-outline-warning w-100">
                            ★ Solo Favoritos
                        </button>
                        <button id="btn-eliminar-seleccionados" class="btn btn-danger d-none">
                            Eliminar Seleccionados
                        </button>
                    </div>
                </div>

                <h2>Contactos</h2>
                <!-- Listado de contactos -->
                <ul id="lista-contactos" class="list-group mb-4"></ul>

                <hr class="hr">

                <!-- Formulario de Nuevo / Edición de Contacto -->
                <h2 id="titulo-form">Nuevo Contacto</h2>
                <form id="form-producto">
                    <div class="row g-2 mb-3">
                        <div class="col-12 col-sm-4">
                            <input type="text" class="form-control" name="nombre" id="input-nombre" placeholder="Nombre" aria-label="Nombre" required>
                        </div>
                        <div class="col-12 col-sm-4">
                            <input type="text" class="form-control" name="apellido" id="input-apellido" placeholder="Apellido" aria-label="Apellido" required>
                        </div>
                        <div class="col-12 col-sm-4">
                            <input type="tel" class="form-control" name="telefono" id="input-telefono" placeholder="Teléfono" aria-label="Teléfono">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit" id="btn-submit">Agregar Contacto</button>
                        <button class="btn btn-secondary d-none" type="button" id="btn-cancelar-edicion">Cancelar Edición</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">
        // Estado global de la aplicación
        let contactos = [
            { id: 1, nombre: 'Juan', apellido: 'Perez', telefono: '1122334455', favorito: false, seleccionado: false }
        ];

        let criterioOrden = 'apellido';
        let soloFavoritos = false;
        let busquedaTexto = '';
        let idContactoEnEdicion = null;

        /**
         * agregarContacto()
         * Agrega o edita un contacto en la lista global y actualiza el renderizado.
         */
        function agregarContacto(nombre, apellido, telefono) {
            if (idContactoEnEdicion !== null) {
                // Modo Edición: busco el contacto por id y actualizo sus datos
                for (let i = 0; i < contactos.length; i++) {
                    if (contactos[i].id === idContactoEnEdicion) {
                        contactos[i].nombre = nombre;
                        contactos[i].apellido = apellido;
                        contactos[i].telefono = telefono;
                        break; // ya lo encontré y actualicé, no sigo recorriendo
                    }
                }
                idContactoEnEdicion = null;
                document.getElementById('titulo-form').textContent = 'Nuevo Contacto';
                document.getElementById('btn-submit').textContent = 'Agregar Contacto';
                document.getElementById('btn-cancelar-edicion').classList.add('d-none');
            } else {
                // Modo Creación
                const nuevoContacto = {
                    id: Date.now(),
                    nombre: nombre.trim(),
                    apellido: apellido.trim(),
                    telefono: telefono.trim(),
                    favorito: false,
                    seleccionado: false
                };
                contactos.push(nuevoContacto);
            }
            mostrarListado();
        }

        /**
         * mostrarListado()
         * Ordena, filtra y renderiza la lista de contactos en el DOM.
         */
        function mostrarListado() {
            const ul = document.getElementById('lista-contactos');
            ul.innerHTML = '';

            // 1. Filtrar por búsqueda y favoritos
            let resultado = [];
            for (let i = 0; i < contactos.length; i++) {
                const contacto = contactos[i];

                const coincideTexto =
                    contacto.nombre.toLowerCase().includes(busquedaTexto) ||
                    contacto.apellido.toLowerCase().includes(busquedaTexto) ||
                    contacto.telefono.includes(busquedaTexto);

                const coincideFavorito = soloFavoritos ? contacto.favorito : true;

                if (coincideTexto && coincideFavorito) {
                    resultado.push(contacto);
                }
            }

            // 2. Ordenar alfabéticamente según el criterio (nombre o apellido)
            resultado.sort((a, b) => {
                const valorA = a[criterioOrden].toLowerCase();
                const valorB = b[criterioOrden].toLowerCase();
                return valorA.localeCompare(valorB);
            });

            // 3. Verificar si hay contactos seleccionados para mostrar el botón de eliminación masiva
            let haySeleccionados = false;
            for (let i = 0; i < contactos.length; i++) {
                if (contactos[i].seleccionado) {
                    haySeleccionados = true;
                    break;
                }
            }
            document.getElementById('btn-eliminar-seleccionados').classList.toggle('d-none', !haySeleccionados);

            // 4. Renderizar elementos en el DOM
            if (resultado.length === 0) {
                ul.innerHTML = '<li class="list-group-item text-muted text-center py-3">No se encontraron contactos.</li>';
                return;
            }

            for (let i = 0; i < resultado.length; i++) {
                const contacto = resultado[i];

                const li = document.createElement('li');
                li.className = `list-group-item d-flex justify-content-between align-items-center ${contacto.favorito ? 'list-group-item-warning' : ''}`;

                li.innerHTML = `
                    <div class="d-flex align-items-center gap-3">
                        <input type="checkbox" class="form-check-input" ${contacto.seleccionado ? 'checked' : ''} onchange="toggleSeleccion(${contacto.id})">
                        <div>
                            <strong>${contacto.apellido}, ${contacto.nombre}</strong>
                            ${contacto.telefono ? `<small class="text-muted d-block">📞 ${contacto.telefono}</small>` : ''}
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm ${contacto.favorito ? 'btn-warning' : 'btn-outline-warning'}" onclick="toggleFavorito(${contacto.id})">
                            ${contacto.favorito ? '★ Favorito' : '☆ Favorito'}
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="prepararEdicion(${contacto.id})">✏️ Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarContacto(${contacto.id})">🗑️ Eliminar</button>
                    </div>
                `;
                ul.appendChild(li);
            }
        }

        // --- MANEJADORES DE EVENTOS Y ACCIONES ---

        function handlerFormulario(e) {
            e.preventDefault();
            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            agregarContacto(inputNombre.value, inputApellido.value, inputTelefono.value);

            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";
        }

        /**
         * toggleFavorito()
         * Recorre la lista de contactos buscando el id indicado y, cuando lo encuentra,
         * invierte su estado de favorito. Uso "break" para cortar el bucle apenas lo hallo,
         * ya que los ids son únicos y no tiene sentido seguir recorriendo.
         */
        function toggleFavorito(id) {
            for (let i = 0; i < contactos.length; i++) {
                if (contactos[i].id === id) {
                    contactos[i].favorito = !contactos[i].favorito;
                    break;
                }
            }
            mostrarListado();
        }

        /**
         * toggleSeleccion()
         * Misma lógica que toggleFavorito, pero para el checkbox de selección múltiple.
         */
        function toggleSeleccion(id) {
            for (let i = 0; i < contactos.length; i++) {
                if (contactos[i].id === id) {
                    contactos[i].seleccionado = !contactos[i].seleccionado;
                    break;
                }
            }
            mostrarListado();
        }

        /**
         * eliminarContacto()
         * Construye un array nuevo con todos los contactos EXCEPTO el que tiene el id indicado.
         */
        function eliminarContacto(id) {
            let nuevaLista = [];
            for (let i = 0; i < contactos.length; i++) {
                if (contactos[i].id !== id) {
                    nuevaLista.push(contactos[i]);
                }
            }
            contactos = nuevaLista;
            mostrarListado();
        }

        /**
         * eliminarSeleccionados()
         * Igual que eliminarContacto, pero descarta todos los contactos marcados como seleccionados.
         */
        function eliminarSeleccionados() {
            let nuevaLista = [];
            for (let i = 0; i < contactos.length; i++) {
                if (!contactos[i].seleccionado) {
                    nuevaLista.push(contactos[i]);
                }
            }
            contactos = nuevaLista;
            mostrarListado();
        }

        /**
         * prepararEdicion()
         * Busca el contacto por id recorriendo el array y, si lo encuentra, carga sus datos
         * en el formulario para que el usuario pueda editarlos.
         */
        function prepararEdicion(id) {
            let contacto = null;
            for (let i = 0; i < contactos.length; i++) {
                if (contactos[i].id === id) {
                    contacto = contactos[i];
                    break;
                }
            }
            if (!contacto) return;

            idContactoEnEdicion = id;
            document.getElementById('input-nombre').value = contacto.nombre;
            document.getElementById('input-apellido').value = contacto.apellido;
            document.getElementById('input-telefono').value = contacto.telefono;

            document.getElementById('titulo-form').textContent = 'Editar Contacto';
            document.getElementById('btn-submit').textContent = 'Guardar Cambios';
            document.getElementById('btn-cancelar-edicion').classList.remove('d-none');
        }

        document.getElementById('btn-cancelar-edicion').addEventListener('click', () => {
            idContactoEnEdicion = null;
            document.getElementById('form-producto').reset();
            document.getElementById('titulo-form').textContent = 'Nuevo Contacto';
            document.getElementById('btn-submit').textContent = 'Agregar Contacto';
            document.getElementById('btn-cancelar-edicion').classList.add('d-none');
        });

        // Configuración de listeners generales
        document.querySelector('form').addEventListener('submit', handlerFormulario);

        document.getElementById('select-orden').addEventListener('change', (e) => {
            criterioOrden = e.target.value;
            mostrarListado();
        });

        document.getElementById('btn-filtro-favoritos').addEventListener('click', (e) => {
            soloFavoritos = !soloFavoritos;
            e.target.classList.toggle('btn-warning', soloFavoritos);
            e.target.classList.toggle('btn-outline-warning', !soloFavoritos);
            mostrarListado();
        });

        document.getElementById('input-buscar').addEventListener('input', (e) => {
            busquedaTexto = e.target.value.toLowerCase().trim();
            mostrarListado();
        });

        document.getElementById('btn-eliminar-seleccionados').addEventListener('click', eliminarSeleccionados);

        // Carga inicial
        mostrarListado();
    </script>
</body>
</html>
